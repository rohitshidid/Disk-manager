name: Release

# Releases are driven by the version in package.json, not by tags you push.
#
# Every push to main is checked: if `v<version>` has no tag yet, that is a new
# version, so it gets tagged, built and published. If the tag already exists,
# nothing happens. Push as often as you like — a README fix does not cost a
# 121 MB build, and a version bump cannot be forgotten about.
#
# The consequence worth knowing: the *tag* is created by this workflow, not
# locally. Bumping the version is the whole act of releasing, wherever you do
# it — `./release.sh`, an editor, or GitHub's own web UI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and republish even if the tag already exists'
        type: boolean
        default: false

permissions:
  contents: write        # needed to create the tag, the release and its asset

concurrency:
  # Two pushes in quick succession must not race to create the same tag.
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags are the whole question here

      - id: decide
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced rebuild of v$VERSION."
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released. Bump the version in package.json to publish a new one."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION has no tag yet — building and publishing it."
          fi

  release:
    name: Build and publish the DMG
    needs: check
    if: needs.check.outputs.should_release == 'true'
    # An Apple-silicon runner, because the DMG bundles an arm64 ncdu taken from
    # this machine's Homebrew. Building on an Intel runner would produce a DMG
    # whose scanner cannot run on the machines it is aimed at.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ncdu
        run: brew install ncdu

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Vendor ncdu, draw the icon, build the DMG
        run: npm run dist

      - name: Check the bundle is signed and self-contained
        run: |
          APP="release/mac-arm64/Disk Manager.app"
          # Ad-hoc is all an unsigned build gets, but it has to verify: an
          # arm64 bundle whose signature does not check out will not launch.
          codesign --verify --deep --strict "$APP"
          # And ncdu has to run without Homebrew on PATH, which is the whole
          # point of vendoring it.
          env -i "$PWD/$APP/Contents/Resources/bin/ncdu" --version

      - uses: actions/upload-artifact@v4
        with:
          name: DiskManager-dmg
          path: release/*.dmg

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # The tag is created here, at this commit, by this step.
          tag_name: v${{ needs.check.outputs.version }}
          name: Disk Manager ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: release/*.dmg
          body: |
            **Apple silicon (arm64), unsigned.**

            macOS will refuse the first launch because the app is not signed by
            an identified developer. To open it: right-click **Disk Manager** in
            Applications → **Open** → **Open**. You only do this once.

            Nothing needs to be installed first — Node and `ncdu` are inside the
            bundle. Grant **Full Disk Access** to Disk Manager before the first
            scan, then quit and reopen it: macOS only applies a new consent to
            freshly launched processes.

            ---
